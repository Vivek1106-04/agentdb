[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentdb"
version = "0.1.0"
description = "Plan-grounded context layer and reproducible NL-to-SQL accuracy benchmark for ClickHouse and Databricks"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Vivek Gangavarapu" }]
keywords = ["clickhouse", "databricks", "delta-lake", "mcp", "text-to-sql", "benchmark", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
]
dependencies = [
    "pyyaml>=6.0",
    "sqlglot>=30.17.0",
]

[project.optional-dependencies]
# Model providers are optional: importing the harness must never require an API
# key or a vendor SDK (SPEC §11.3 — adapters are pluggable).
anthropic = ["anthropic>=0.45"]
# The [async] marker pulls aiohttp. The harness only ever calls the async client,
# so without it the extra installs and then fails at connect time.
clickhouse = ["clickhouse-connect[async]>=0.8"]
databricks = ["databricks-sdk>=0.40"]
mcp = ["mcp>=2.0"]
# The bi-temporal exemplar store of SPEC §10. Postgres is agentdb's private
# state store, never a measured engine — the store speaks plain DB-API through
# core/memory, and the import-linter contract keeps it out of the adapters.
memory = ["psycopg[binary]>=3.2"]
# Seeding only. DuckDB is the TPC-H generator for the local ClickHouse half of
# the cross-engine suite (scripts/load_tpch_clickhouse.py); nothing measured
# imports it, and no benchmark run needs it installed.
seed = ["duckdb>=1.1"]

[project.scripts]
agentdb = "agentdb.cli:main"

[project.urls]
Homepage = "https://github.com/Vivek1106-04/agentdb"
Documentation = "https://github.com/Vivek1106-04/agentdb/tree/main/docs"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-asyncio>=0.25",
  "hypothesis>=6.122",
  "ruff>=0.9",
  "mypy>=1.14",
  "import-linter>=2.1",
  "jsonschema>=4.23",
  # The MCP SDK is a runtime *extra*, not a dependency — but the transport layer
  # is wired against the vendor's own models, and only a test holding the real
  # ones catches a field rename across an SDK major version.
  "mcp>=2.0",
  # Likewise psycopg: the exemplar store's unit tier runs against a fake
  # connection, but the e2e tier has to prove the SQL against real pgvector.
  "psycopg[binary]>=3.2",
  "types-jsonschema>=4.23",
  "types-pyyaml>=6.0.12.20260724",
]

[tool.hatch.build.targets.wheel]
# Two independent top-level packages in one distribution. agenteval ships
# alongside agentdb for convenience only; it depends on none of it (SPEC §4.1.6).
packages = ["src/agentdb", "eval/agenteval"]

# ---------------------------------------------------------------------------
# lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "eval", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "UP",        # pyupgrade
  "B",         # bugbear
  "A",         # builtins shadowing
  "C4",        # comprehensions
  "SIM",       # simplify
  "PTH",       # pathlib
  "RET",       # returns
  "ARG",       # unused arguments
  "TRY",       # tryceratops
  "RUF",
]
ignore = [
  "TRY003",  # long messages outside exception class: we prefer readable errors
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# typing
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false
disallow_any_generics = true
no_implicit_reexport = true
files = ["src", "eval", "tests", "scripts"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

# duckdb is the seeding-only TPC-H generator and is deliberately absent from the
# CI environment (`uv sync --all-groups` installs no extras). The one import of
# it is guarded and raises with the install command, so a missing stub here is
# the expected state rather than a gap.
[[tool.mypy.overrides]]
module = "duckdb"
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# tests + coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
markers = [
  "e2e: requires a live ClickHouse and/or Databricks warehouse (deselect with -m 'not e2e')",
]

[tool.coverage.run]
branch = true
source = ["src/agentdb", "eval/agenteval"]
parallel = false

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
  "if __name__ == .__main__.:",
]

# ---------------------------------------------------------------------------
# architectural isolation (SPEC 4.1.6, 12)
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["agentdb", "agenteval"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "agenteval is vendor-neutral: it must never import agentdb"
type = "forbidden"
source_modules = ["agenteval"]
forbidden_modules = ["agentdb"]

# NOTE: contracts naming a package are added as that package lands;
# import-linter errors on modules that do not exist yet, so the contract set
# grows with the codebase rather than ahead of it.

[[tool.importlinter.contracts]]
name = "layers"
type = "layers"
layers = [
  "agentdb.bench",
  "agentdb.server",
  "agentdb.core",
  "agentdb.adapters",
  "agentdb.config",
]
exhaustive = false

# Core reasons about engines through the Adapter protocol and the capability
# flags beside it. Reaching for a concrete adapter would put engine knowledge
# back into core and make a third engine a refactor (SPEC §4.1.1).
# Postgres survives spec 1.2 only as the exemplar store of SPEC §10. An adapter
# reaching into it would be the back door through which it returns as a third
# measured engine, so the contract forbids the import outright (SPEC §12).
[[tool.importlinter.contracts]]
name = "the memory store is agentdb's private state, never an engine adapter's dependency"
type = "forbidden"
source_modules = ["agentdb.adapters"]
forbidden_modules = ["agentdb.core.memory"]

[[tool.importlinter.contracts]]
name = "core and the server know the adapter contract, never a concrete engine"
type = "forbidden"
source_modules = ["agentdb.core", "agentdb.server"]
forbidden_modules = [
  "agentdb.adapters.clickhouse",
  "agentdb.adapters.clickhouse_sql",
  "agentdb.adapters.clickhouse_client",
  "agentdb.adapters.databricks",
  "agentdb.adapters.databricks_sql",
  "agentdb.adapters.databricks_client",
]
