# Family A arms — agentdb's context ablations (SPEC §11.3).
#
# The harness never imports agentdb: each arm names a factory by dotted path and
# the factory is resolved at run time. That indirection is the point. Anyone can
# add a row here for their own grounding service and be scored on the same tasks,
# with the same model, the same seeds and the same grader.
#
# A0_baseline and A7_oracle are built in — they need no grounding layer at all.

# Every entry names the engine it grounds against. An arm is a provider pointed
# at an engine: the ClickHouse factory in a --engine databricks run would ground
# the model in ClickHouse's tables while executing on the warehouse, and that run
# completes with numbers nobody can reproduce. A missing pairing is an error.

- arm: A1_stats
  engine: clickhouse
  provider: agentdb.bench.provider:clickhouse_provider
  options:
    level: stats
    name: agentdb/A1_stats

- arm: A2_layout
  engine: clickhouse
  provider: agentdb.bench.provider:clickhouse_provider
  options:
    level: layout
    name: agentdb/A2_layout

- arm: A3_plan
  engine: clickhouse
  provider: agentdb.bench.provider:clickhouse_provider
  plan_review: true
  options:
    level: layout
    name: agentdb/A3_plan
    plan_review: true

- arm: A1_stats
  engine: databricks
  provider: agentdb.bench.provider:databricks_provider
  options:
    level: stats
    name: agentdb/A1_stats

- arm: A2_layout
  engine: databricks
  provider: agentdb.bench.provider:databricks_provider
  options:
    level: layout
    name: agentdb/A2_layout

- arm: A3_plan
  engine: databricks
  provider: agentdb.bench.provider:databricks_provider
  plan_review: true
  options:
    level: layout
    name: agentdb/A3_plan
    plan_review: true

# A4 and A5 are A3 plus the bi-temporal exemplar store (SPEC §10, §11.3). They
# differ by one flag: A5 additionally serves the queries that failed here, with
# their error class, as explicit "do not do this" context. Nobody else ships
# that block, which is exactly why it gets its own arm rather than being folded
# into A4 and reported as one number.
#
# Both need AGENTDB_MEMORY_DSN reachable (make up). The store is agentdb's
# private state — the harness resolves a factory by name and never learns a
# Postgres exists.

- arm: A4_memory
  engine: clickhouse
  provider: agentdb.bench.memory_provider:clickhouse_memory_provider
  plan_review: true
  options:
    name: agentdb/A4_memory

- arm: A5_negmemory
  engine: clickhouse
  provider: agentdb.bench.memory_provider:clickhouse_memory_provider
  plan_review: true
  options:
    name: agentdb/A5_negmemory
    include_failures: true

# A6 is A5 plus the advisor's findings, rendered as context (SPEC §11.3, §9).
#
# Its demand signal is a committed reference workload of third-party query
# shapes — ClickBench's published queries — rather than the live query log. On a
# benchmark instance that log holds this project's own gold executions, so
# mining it would hand the advisor the answers and call the result an ablation.
# The honest limitation, stated in the module and again here: A6 measures the
# advisor against a representative workload, not the operator's real one.

- arm: A6_full
  engine: clickhouse
  provider: agentdb.bench.advised_provider:clickhouse_advised_provider
  plan_review: true
  options:
    name: agentdb/A6_full
    workload: clickbench

# Family S lists whole systems under test, and agentdb is one of them. S5 is the
# same code path as A6 — the same factory, the same reference workload, the same
# fingerprint inputs — listed separately so the Family S table reads as a clean
# like-for-like against ClickHouse Agents, Genie and the official MCP servers
# rather than making a reader cross-reference two tables (SPEC §11.3).

- arm: S5_agentdb
  engine: clickhouse
  provider: agentdb.bench.advised_provider:clickhouse_advised_provider
  plan_review: true
  options:
    name: agentdb/S5_agentdb
    workload: clickbench
