# Family A arms — agentdb's context ablations (SPEC §11.3).
#
# The harness never imports agentdb: each arm names a factory by dotted path and
# the factory is resolved at run time. That indirection is the point. Anyone can
# add a row here for their own grounding service and be scored on the same tasks,
# with the same model, the same seeds and the same grader.
#
# A0_baseline and A7_oracle are built in — they need no grounding layer at all.

- arm: A1_stats
  provider: agentdb.bench.provider:clickhouse_provider
  options:
    level: stats
    name: agentdb/A1_stats

- arm: A2_layout
  provider: agentdb.bench.provider:clickhouse_provider
  options:
    level: layout
    name: agentdb/A2_layout

- arm: A3_plan
  provider: agentdb.bench.provider:clickhouse_provider
  plan_review: true
  options:
    level: layout
    name: agentdb/A3_plan
    plan_review: true

# A4 and A5 are A3 plus the bi-temporal exemplar store (SPEC §10, §11.3). They
# differ by one flag: A5 additionally serves the queries that failed here, with
# their error class, as explicit "do not do this" context. Nobody else ships
# that block, which is exactly why it gets its own arm rather than being folded
# into A4 and reported as one number.
#
# Both need AGENTDB_MEMORY_DSN reachable (make up). The store is agentdb's
# private state — the harness resolves a factory by name and never learns a
# Postgres exists.

- arm: A4_memory
  provider: agentdb.bench.memory_provider:clickhouse_memory_provider
  plan_review: true
  options:
    name: agentdb/A4_memory

- arm: A5_negmemory
  provider: agentdb.bench.memory_provider:clickhouse_memory_provider
  plan_review: true
  options:
    name: agentdb/A5_negmemory
    include_failures: true
