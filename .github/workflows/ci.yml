name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "0"

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --all-groups --python ${{ matrix.python-version }}

      - name: Lint
        run: |
          uv run ruff format --check .
          uv run ruff check --output-format=github .

      - name: Typecheck
        run: uv run mypy

      - name: Architectural isolation (agenteval must not import agentdb)
        run: uv run lint-imports

      - name: Unit + contract tests, 100% line and branch coverage gate
        run: uv run pytest -m "not e2e" --cov --cov-branch --cov-report=term-missing

      - name: Coverage XML
        if: matrix.python-version == '3.12'
        run: uv run coverage xml

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
