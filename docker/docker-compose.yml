name: agentdb

services:
  postgres:
    build:
      context: ./postgres
    environment:
      POSTGRES_USER: agentdb
      POSTGRES_PASSWORD: agentdb
      POSTGRES_DB: agentdb
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./seed/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentdb -d agentdb"]
      interval: 3s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:25.9
    environment:
      CLICKHOUSE_USER: agentdb
      CLICKHOUSE_PASSWORD: agentdb
      CLICKHOUSE_DB: agentdb
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "58123:8123"
      - "59000:9000"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - chdata:/var/lib/clickhouse
      - ./seed/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "agentdb", "--password", "agentdb", "--query", "SELECT 1"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  chdata:
